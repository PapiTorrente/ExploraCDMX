name: exploracdmx
description: "Una aplicación para explorar la Ciudad de México"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.0+8

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  #Cambio de Iidoma
  flutter_localizations:
    sdk: flutter

  #Firebase
  firebase_core:
  cloud_firestore: ^6.0.2
  firebase_auth: ^6.5.7

  #Notificaciones
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

  #Inicio de Sesión
  google_sign_in: ^7.2.0

  #Tarjeta Grande
  cached_network_image: ^4.0.0
  url_launcher: ^6.3.3

  #Tarjeta de Agendar Evento
  flex_color_picker: ^4.0.0
  cupertino_calendar_picker: ^3.0.0

  #Pantalla de Calendario
  syncfusion_flutter_calendar: ^35.1.40+1
  syncfusion_localizations: ^35.1.40+1

  #Navbar
  cupertino_icons: ^2.0.0

  #Otros
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icono_app_1000px.png